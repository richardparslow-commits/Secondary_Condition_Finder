name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
    inputs:
      deploy_legacy_azure:
        description: 'Manually deploy the legacy Azure Static Web Apps target (set to true)'
        required: false
        default: false
        type: boolean
      close_environment:
        description: 'Close a stale PR staging environment to free up slots (set to true)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    if: inputs.deploy_legacy_azure == true && inputs.close_environment != true
    runs-on: ubuntu-latest
    name: Build and Deploy Legacy Azure Target
    concurrency:
      group: azure-swa-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, immutable pin shared with primary CI
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_TREE_04B340F0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e. PR comments)
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
          app_build_command: "npm run build:azure"

  close_pull_request_job:
    if: inputs.close_environment == true
    runs-on: ubuntu-latest
    name: Close Legacy Azure Pull Request Environment
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_TREE_04B340F0F }}
          action: "close"
          app_location: "/"
