name: Production Runtime Readiness

on:
  workflow_run:
    workflows:
      - Azure Static Web Apps CI/CD
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  verify-runtime:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_BASE_URL: https://gentle-tree-04b340f0f.7.azurestaticapps.net
      RUNTIME_READINESS_ISSUE: '213'
    steps:
      - name: Probe production route matrix
        id: routes
        shell: bash
        run: |
          set -euo pipefail

          probe_status() {
            local path="$1"
            local status
            set +e
            status="$(curl --silent --show-error --location \
              --connect-timeout 10 \
              --max-time 20 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$PRODUCTION_BASE_URL$path")"
            local curl_status=$?
            set -e
            if [ "$curl_status" -ne 0 ]; then
              status="000"
            fi
            printf '%s' "$status"
          }

          root_status="$(probe_status '/')"
          about_status="$(probe_status '/about')"
          va_forms_status="$(probe_status '/va-forms')"

          echo "root_status=$root_status" >> "$GITHUB_OUTPUT"
          echo "about_status=$about_status" >> "$GITHUB_OUTPUT"
          echo "va_forms_status=$va_forms_status" >> "$GITHUB_OUTPUT"

          {
            echo "## Production route matrix"
            echo "- /: $root_status"
            echo "- /about: $about_status"
            echo "- /va-forms: $va_forms_status"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production runtime readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          body_file="$tmp_dir/body.html"

          set +e
          http_status="$(curl --silent --show-error --location \
            --connect-timeout 10 \
            --max-time 20 \
            --header 'Accept: text/html' \
            --output "$body_file" \
            --write-out '%{http_code}' \
            "$PRODUCTION_BASE_URL/runtime-readiness")"
          curl_status=$?
          set -e

          ready=false
          outcome="not_ready"
          if [ "$curl_status" -ne 0 ]; then
            outcome="network_error"
            http_status="${http_status:-000}"
          elif [ "$http_status" != "200" ]; then
            outcome="http_error"
          elif grep -Fq 'data-runtime-readiness="ready"' "$body_file"; then
            ready=true
            outcome="ready"
          elif grep -Fq 'data-runtime-readiness="not_ready"' "$body_file"; then
            outcome="payload_not_ready"
          else
            outcome="unexpected_payload"
          fi

          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

          {
            echo "## Production runtime readiness"
            echo "- deployed commit: ${{ github.event.workflow_run.head_sha }}"
            echo "- Azure deployment run: ${{ github.event.workflow_run.id }}"
            echo "- request outcome: $outcome"
            echo "- HTTP status: $http_status"
            echo "- workflow-session crypto: $ready"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ready" != true ]; then
            exit 1
          fi

      - name: Record failed runtime evidence
        if: failure() && steps.readiness.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > runtime-failure.md <<EOF
          Production runtime readiness did not satisfy the gate.

          - Timestamp (UTC): $timestamp
          - Deployed commit: \`${{ github.event.workflow_run.head_sha }}\`
          - Production URL: \`$PRODUCTION_BASE_URL\`
          - Azure deployment run: #${{ github.event.workflow_run.run_number }} (run ${{ github.event.workflow_run.id }})
          - Route matrix: \`/=${{ steps.routes.outputs.root_status }}\`, \`/about=${{ steps.routes.outputs.about_status }}\`, \`/va-forms=${{ steps.routes.outputs.va_forms_status }}\`
          - Readiness request outcome: \`${{ steps.readiness.outputs.outcome }}\`
          - Readiness HTTP status: \`${{ steps.readiness.outputs.http_status }}\`
          - Workflow-session crypto readiness: \`false\`

          Route probes record status codes only. The readiness response body was not printed or attached. No secret value, secret length, hash, derived key material, cookie payload, or environment-variable value was recorded. The gate remains open.
          EOF

          gh issue comment "$RUNTIME_READINESS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file runtime-failure.md

      - name: Record successful runtime evidence
        if: steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > runtime-evidence.md <<EOF
          Production runtime readiness verified with non-sensitive evidence.

          - Timestamp (UTC): $timestamp
          - Deployed commit: \`${{ github.event.workflow_run.head_sha }}\`
          - Production URL: \`$PRODUCTION_BASE_URL\`
          - Azure deployment run: #${{ github.event.workflow_run.run_number }} (run ${{ github.event.workflow_run.id }})
          - Route matrix: \`/=${{ steps.routes.outputs.root_status }}\`, \`/about=${{ steps.routes.outputs.about_status }}\`, \`/va-forms=${{ steps.routes.outputs.va_forms_status }}\`
          - Runtime readiness HTTP status: ${{ steps.readiness.outputs.http_status }}
          - Readiness status: \`ready\`
          - Workflow-session crypto round trip: \`true\`

          Route probes record status codes only. No secret value, secret length, hash, derived key material, cookie payload, or environment-variable value was recorded.
          EOF

          gh issue comment "$RUNTIME_READINESS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file runtime-evidence.md
          gh issue close "$RUNTIME_READINESS_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
