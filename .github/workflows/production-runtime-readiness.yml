name: Production Runtime Readiness

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  statuses: read
  issues: write

jobs:
  verify-runtime:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_BASE_URL: https://secondary-condition-finder.vercel.app
      RUNTIME_READINESS_ISSUE: '213'
    steps:
      - name: Resolve intended production commit
        id: commit
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          commit_sha="$WORKFLOW_RUN_SHA"

          if ! [[ "$commit_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Resolved production commit is not a full 40-character SHA." >&2
            exit 1
          fi

          echo "sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved production commit from successful main CI: $commit_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for exact-commit Vercel deployment status
        id: vercel
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          vercel_state="missing"
          vercel_target_url=""

          for attempt in $(seq 1 30); do
            status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA/status")"
            vercel_state="$(jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "missing"' <<< "$status_json")"
            vercel_target_url="$(jq -r '[.statuses[] | select(.context == "Vercel")][0].target_url // ""' <<< "$status_json")"

            case "$vercel_state" in
              success)
                break
                ;;
              error|failure)
                echo "Vercel reported terminal state '$vercel_state' for $COMMIT_SHA." >&2
                exit 1
                ;;
              *)
                if [ "$attempt" -eq 30 ]; then
                  echo "Timed out waiting for Vercel success on $COMMIT_SHA; last state: $vercel_state." >&2
                  exit 1
                fi
                sleep 10
                ;;
            esac
          done

          if [ -z "$vercel_target_url" ]; then
            echo "Vercel success status did not include a deployment target URL." >&2
            exit 1
          fi

          deployment_slug="${vercel_target_url##*/}"
          deployment_slug="${deployment_slug%%\?*}"
          if [ -z "$deployment_slug" ]; then
            echo "Unable to derive the Vercel deployment identifier from the status target." >&2
            exit 1
          fi

          deployment_id="dpl_$deployment_slug"
          echo "state=$vercel_state" >> "$GITHUB_OUTPUT"
          echo "target_url=$vercel_target_url" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

          {
            echo "## Exact-commit Vercel deployment"
            echo "- commit: $COMMIT_SHA"
            echo "- Vercel commit status: $vercel_state"
            echo "- expected production deployment: $deployment_id"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for production alias to serve exact Vercel deployment
        id: production
        env:
          EXPECTED_DEPLOYMENT_ID: ${{ steps.vercel.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          body_file="$tmp_dir/root.html"

          http_status="000"
          served_deployment=""

          for attempt in $(seq 1 30); do
            set +e
            http_status="$(curl --silent --show-error --location \
              --connect-timeout 10 \
              --max-time 20 \
              --header 'Accept: text/html' \
              --output "$body_file" \
              --write-out '%{http_code}' \
              "$PRODUCTION_BASE_URL/")"
            curl_status=$?
            set -e

            if [ "$curl_status" -eq 0 ] && [ "$http_status" = "200" ]; then
              served_deployment="$(grep -o 'data-dpl-id="[^"]*"' "$body_file" | head -n 1 | cut -d '"' -f 2 || true)"
              if [ "$served_deployment" = "$EXPECTED_DEPLOYMENT_ID" ]; then
                break
              fi
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "Production alias did not converge on $EXPECTED_DEPLOYMENT_ID within the wait window." >&2
              echo "Last HTTP status: $http_status" >&2
              echo "Last observed deployment: ${served_deployment:-unresolved}" >&2
              exit 1
            fi

            sleep 10
          done

          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$served_deployment" >> "$GITHUB_OUTPUT"

          {
            echo "## Production alias convergence"
            echo "- production URL: $PRODUCTION_BASE_URL"
            echo "- HTTP status: $http_status"
            echo "- served Vercel deployment: $served_deployment"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate production route matrix
        id: routes
        shell: bash
        run: |
          set -euo pipefail

          # Every public route the manifest marks for production
          # (scripts/lib/public-routes.mjs). The set is pinned by
          # tests/public-route-manifest.test.ts, so a new page is either probed
          # here or recorded as excluded with a reason — it cannot fall out of
          # this matrix silently. /results (a 307 shim to /secondary) and
          # /runtime-readiness (probed by the dedicated readiness step below,
          # which also asserts the readiness marker) are the declared exclusions.
          routes=(
            "/"
            "/about"
            "/get-records"
            "/pathways"
            "/secondary"
            "/secondary/condition-caused-by"
            "/secondary/condition-aggravation"
            "/secondary/legal"
            "/secondary/diagnosed"
            "/secondary/service-connected"
            "/secondary/ratings"
            "/secondary/upload"
            "/secondary/suggestions"
            "/secondary/evidence"
            "/presumptive"
            "/presumptive/results"
            "/scenarios"
            "/va-forms"
            "/va-forms/finder"
            "/va-reference"
            "/va-reference/service-branches"
            "/privacy"
            "/privacy/request"
            "/terms"
            "/va-account"
          )

          probe_status() {
            local path="$1"
            local status
            set +e
            status="$(curl --silent --show-error --location \
              --connect-timeout 10 \
              --max-time 20 \
              --header 'Accept: text/html' \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$PRODUCTION_BASE_URL$path")"
            local curl_status=$?
            set -e
            if [ "$curl_status" -ne 0 ]; then
              status="000"
            fi
            printf '%s' "$status"
          }

          matrix=""
          failures=()
          {
            echo "## Production route matrix"
            for route in "${routes[@]}"; do
              status="$(probe_status "$route")"
              echo "- $route: $status"
              matrix="${matrix}${route}=${status};"
              if [ "$status" != "200" ]; then
                failures+=("$route=$status")
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "route_count=${#routes[@]}" >> "$GITHUB_OUTPUT"
          echo "failure_count=${#failures[@]}" >> "$GITHUB_OUTPUT"

          if [ "${#failures[@]}" -ne 0 ]; then
            echo "Production route gate failed: ${failures[*]}" >&2
            exit 1
          fi

      - name: Verify production runtime readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          body_file="$tmp_dir/body.html"

          set +e
          http_status="$(curl --silent --show-error --location \
            --connect-timeout 10 \
            --max-time 20 \
            --header 'Accept: text/html' \
            --output "$body_file" \
            --write-out '%{http_code}' \
            "$PRODUCTION_BASE_URL/runtime-readiness")"
          curl_status=$?
          set -e

          ready=false
          outcome="not_ready"
          if [ "$curl_status" -ne 0 ]; then
            outcome="network_error"
            http_status="${http_status:-000}"
          elif [ "$http_status" != "200" ]; then
            outcome="http_error"
          elif grep -Fq 'data-runtime-readiness="ready"' "$body_file"; then
            ready=true
            outcome="ready"
          elif grep -Fq 'data-runtime-readiness="not_ready"' "$body_file"; then
            outcome="payload_not_ready"
          else
            outcome="unexpected_payload"
          fi

          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

          {
            echo "## Production runtime readiness"
            echo "- deployed commit: ${{ steps.commit.outputs.sha }}"
            echo "- Vercel deployment: ${{ steps.vercel.outputs.deployment_id }}"
            echo "- request outcome: $outcome"
            echo "- HTTP status: $http_status"
            echo "- workflow-session crypto: $ready"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ready" != true ]; then
            exit 1
          fi

      - name: Probe production health for adjacency-graph state
        id: graph
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          body_file="$tmp_dir/health.json"

          set +e
          http_status="$(curl --silent --show-error --location \
            --connect-timeout 10 \
            --max-time 20 \
            --header 'Accept: application/json' \
            --output "$body_file" \
            --write-out '%{http_code}' \
            "$PRODUCTION_BASE_URL/api/health")"
          curl_status=$?
          set -e

          graph_status="unresolved"
          nodes="unresolved"
          edges="unresolved"
          if [ "$curl_status" -eq 0 ] && [ "$http_status" = "200" ]; then
            graph_status="$(jq -r '.components.kbGraph.status // "unresolved"' "$body_file")"
            nodes="$(jq -r '.components.kbGraph.nodes // "unresolved"' "$body_file")"
            edges="$(jq -r '.components.kbGraph.edges // "unresolved"' "$body_file")"
          fi

          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"
          echo "graph_status=$graph_status" >> "$GITHUB_OUTPUT"
          echo "nodes=$nodes" >> "$GITHUB_OUTPUT"
          echo "edges=$edges" >> "$GITHUB_OUTPUT"

          {
            echo "## Adjacency-graph migration state"
            echo "- health HTTP status: $http_status"
            echo "- graph validation: $graph_status"
            echo "- migrated nodes: $nodes"
            echo "- authored edges: $edges"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$curl_status" -ne 0 ] || [ "$http_status" != "200" ] || [ "$graph_status" != "ok" ]; then
            echo "Production health did not report a validated adjacency graph (HTTP $http_status, graph status $graph_status)." >&2
            exit 1
          fi

      - name: Record failed runtime evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_COMMIT: ${{ steps.commit.outputs.sha }}
          VERCEL_DEPLOYMENT: ${{ steps.vercel.outputs.deployment_id }}
          VERCEL_STATE: ${{ steps.vercel.outputs.state }}
          ROUTE_MATRIX: ${{ steps.routes.outputs.matrix }}
          ROUTE_FAILURES: ${{ steps.routes.outputs.failure_count }}
          READINESS_OUTCOME: ${{ steps.readiness.outputs.outcome }}
          READINESS_HTTP_STATUS: ${{ steps.readiness.outputs.http_status }}
          GRAPH_STATUS: ${{ steps.graph.outputs.graph_status }}
          GRAPH_NODES: ${{ steps.graph.outputs.nodes }}
          GRAPH_EDGES: ${{ steps.graph.outputs.edges }}
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > runtime-failure.md <<EOF
          Production runtime readiness did not satisfy the gate.

          - Timestamp (UTC): $timestamp
          - Deployed commit: \`${DEPLOYED_COMMIT:-unresolved}\`
          - Production URL: \`$PRODUCTION_BASE_URL\`
          - Vercel deployment: \`${VERCEL_DEPLOYMENT:-unresolved}\`
          - Vercel commit status: \`${VERCEL_STATE:-unresolved}\`
          - Route matrix failures: \`${ROUTE_FAILURES:-unresolved}\`
          - Route matrix: \`${ROUTE_MATRIX:-unresolved}\`
          - Readiness request outcome: \`${READINESS_OUTCOME:-unresolved}\`
          - Readiness HTTP status: \`${READINESS_HTTP_STATUS:-unresolved}\`
          - Adjacency graph validation: \`${GRAPH_STATUS:-unresolved}\`
          - Adjacency graph nodes: \`${GRAPH_NODES:-unresolved}\`
          - Adjacency graph edges: \`${GRAPH_EDGES:-unresolved}\`

          Route probes record status codes only. Temporary response bodies are deleted and are not printed or attached. No secret value, secret length, hash, derived key material, cookie payload, or environment-variable value was recorded. The gate remains open.
          EOF

          gh issue comment "$RUNTIME_READINESS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file runtime-failure.md

      - name: Record successful runtime evidence
        if: steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > runtime-evidence.md <<EOF
          Production runtime readiness verified with non-sensitive evidence.

          - Timestamp (UTC): $timestamp
          - Deployed commit: \`${{ steps.commit.outputs.sha }}\`
          - Production URL: \`$PRODUCTION_BASE_URL\`
          - Vercel deployment: \`${{ steps.vercel.outputs.deployment_id }}\`
          - Vercel commit status: \`${{ steps.vercel.outputs.state }}\`
          - Route matrix: \`${{ steps.routes.outputs.route_count }} routes, ${{ steps.routes.outputs.failure_count }} failures\`
          - Route statuses: \`${{ steps.routes.outputs.matrix }}\`
          - Runtime readiness HTTP status: ${{ steps.readiness.outputs.http_status }}
          - Readiness status: \`ready\`
          - Workflow-session crypto round trip: \`true\`
          - Adjacency graph: \`${{ steps.graph.outputs.graph_status }} (nodes: ${{ steps.graph.outputs.nodes }}, edges: ${{ steps.graph.outputs.edges }})\`

          The production alias was confirmed to serve the Vercel deployment associated with the exact commit status before the readiness probe ran. Route probes record status codes only. Temporary response bodies are deleted and are not printed or attached. No secret value, secret length, hash, derived key material, cookie payload, or environment-variable value was recorded.
          EOF

          gh issue comment "$RUNTIME_READINESS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file runtime-evidence.md
          gh issue close "$RUNTIME_READINESS_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
