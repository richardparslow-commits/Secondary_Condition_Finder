name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ci-install.log
        continue-on-error: true
        id: install
      - name: Audit high-severity dependencies
        run: |
          set -o pipefail
          npm run audit:high 2>&1 | tee ci-audit.log
        continue-on-error: true
        id: audit
      - name: Audit citation verification
        run: |
          set -o pipefail
          npm run citations:audit 2>&1 | tee ci-citations.log
        continue-on-error: true
        id: citations
      - name: Run lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ci-lint.log
        continue-on-error: true
        id: lint
      - name: Run typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-typecheck.log
        continue-on-error: true
        id: typecheck
      - name: Run tests with flaky retry
        id: test
        continue-on-error: true
        run: |
          : > ci-test.log
          test_flaky=false
          test_passed=false
          for attempt in 1 2; do
            attempt_log="ci-test-attempt-${attempt}.log"
            echo "=== Vitest attempt ${attempt}/2 ===" | tee -a ci-test.log
            npm test > "$attempt_log" 2>&1
            status=$?
            cat "$attempt_log" | tee -a ci-test.log
            if [ "$status" -eq 0 ]; then
              test_passed=true
              if [ "$attempt" -eq 2 ]; then test_flaky=true; fi
              break
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "First test attempt failed; rerunning once to detect a flaky failure." | tee -a ci-test.log
            fi
          done
          echo "flaky=${test_flaky}" >> "$GITHUB_OUTPUT"
          echo "passed=${test_passed}" >> "$GITHUB_OUTPUT"
          if [ "$test_passed" != true ]; then exit 1; fi
      - name: Run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-build.log
        continue-on-error: true
        id: build
      - name: Collect diagnostic summary
        if: always()
        id: diagnostics
        run: |
          {
            echo "# CI diagnostic summary"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo
            echo "## Step outcomes"
            echo "- install: ${{ steps.install.outcome }}"
            echo "- audit: ${{ steps.audit.outcome }}"
            echo "- citations: ${{ steps.citations.outcome }}"
            echo "- lint: ${{ steps.lint.outcome }}"
            echo "- typecheck: ${{ steps.typecheck.outcome }}"
            echo "- test: ${{ steps.test.outcome }}"
            echo "- test flaky: ${{ steps.test.outputs.flaky }}"
            echo "- build: ${{ steps.build.outcome }}"
            echo
            echo "## Failure excerpts"
            for log in ci-install.log ci-audit.log ci-citations.log ci-lint.log ci-typecheck.log ci-test.log ci-test-attempt-1.log ci-test-attempt-2.log ci-build.log; do
              if [ -f "$log" ]; then
                echo
                echo "### $log"
                grep -E -i -m 20 'error|fail|failed|failing|exception|assert| ✘ |✖|vulnerabilit' "$log" || tail -n 20 "$log"
              fi
            done
          } > ci-diagnostic-summary.md
          cat ci-diagnostic-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            ci-*.log
            ci-diagnostic-summary.md
          retention-days: 14
      - name: Ensure CI labels exist
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "ci-failure" --color "d73a49" --description "CI pipeline failure" --force 2>/dev/null || true
          gh label create "ci-flaky" --color "fbca04" --description "CI test passed only after a retry" --force 2>/dev/null || true
      - name: Create failure or flaky issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILED_STEPS=""
          [ "${{ steps.install.outcome }}" = "failure" ] && FAILED_STEPS="install"
          [ "${{ steps.audit.outcome }}" = "failure" ] && FAILED_STEPS="${FAILED_STEPS:+$FAILED_STEPS, }audit"
          [ "${{ steps.citations.outcome }}" = "failure" ] && FAILED_STEPS="${FAILED_STEPS:+$FAILED_STEPS, }citations"
          [ "${{ steps.lint.outcome }}" = "failure" ] && FAILED_STEPS="${FAILED_STEPS:+$FAILED_STEPS, }lint"
          [ "${{ steps.typecheck.outcome }}" = "failure" ] && FAILED_STEPS="${FAILED_STEPS:+$FAILED_STEPS, }typecheck"
          [ "${{ steps.test.outcome }}" = "failure" ] && FAILED_STEPS="${FAILED_STEPS:+$FAILED_STEPS, }test"
          [ "${{ steps.build.outcome }}" = "failure" ] && FAILED_STEPS="${FAILED_STEPS:+$FAILED_STEPS, }build"
          {
            echo "**Branch:** ${GITHUB_REF_NAME}"
            echo "**Commit:** [${GITHUB_SHA::7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "**Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "**Diagnostics artifact:** ci-diagnostics-${GITHUB_RUN_ID}"
            echo
            echo "## Diagnostic summary"
            cat ci-diagnostic-summary.md
          } > ci-issue-body.md
          if [ -n "$FAILED_STEPS" ]; then
            ISSUE_TITLE="CI failure: ${FAILED_STEPS} [${GITHUB_SHA::7}]"
            EXISTING_ISSUE=$(gh issue list --state open --label ci-failure --search "in:title ${ISSUE_TITLE}" --json number --jq '.[0].number')
            if [ -z "$EXISTING_ISSUE" ]; then gh issue create --title "$ISSUE_TITLE" --body-file ci-issue-body.md --label "ci-failure"; else echo "An open CI failure issue already exists (#${EXISTING_ISSUE}); not creating a duplicate."; fi
          elif [ "${{ steps.test.outputs.flaky }}" = "true" ]; then
            ISSUE_TITLE="Flaky test detected [${GITHUB_SHA::7}]"
            EXISTING_ISSUE=$(gh issue list --state open --label ci-flaky --search "in:title ${ISSUE_TITLE}" --json number --jq '.[0].number')
            if [ -z "$EXISTING_ISSUE" ]; then gh issue create --title "$ISSUE_TITLE" --body-file ci-issue-body.md --label "ci-flaky"; else echo "An open flaky-test issue already exists (#${EXISTING_ISSUE}); not creating a duplicate."; fi
          fi
      - name: Fail the job if any gate failed
        if: always()
        run: |
          if [ "${{ steps.install.outcome }}" = "failure" ] || [ "${{ steps.audit.outcome }}" = "failure" ] || [ "${{ steps.citations.outcome }}" = "failure" ] || [ "${{ steps.lint.outcome }}" = "failure" ] || [ "${{ steps.typecheck.outcome }}" = "failure" ] || [ "${{ steps.test.outcome }}" = "failure" ] || [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "One or more CI gates failed. See the diagnostic summary and artifact."
            exit 1
          fi
