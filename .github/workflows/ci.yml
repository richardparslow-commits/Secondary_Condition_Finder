name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ci-install.log
        continue-on-error: true
        id: install
      - name: Audit high-severity dependencies
        run: |
          set -o pipefail
          npm run audit:high 2>&1 | tee ci-audit.log
        continue-on-error: true
        id: audit
      - name: Audit citation verification
        run: |
          set -o pipefail
          npm run citations:audit 2>&1 | tee ci-citations.log
        continue-on-error: true
        id: citations
      - name: Validate knowledge base
        run: |
          set -o pipefail
          npm run kb:validate 2>&1 | tee ci-kb-validate.log
        continue-on-error: true
        id: kb_validate
      - name: Run lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ci-lint.log
        continue-on-error: true
        id: lint
      - name: Run typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-typecheck.log
        continue-on-error: true
        id: typecheck
      - name: Run tests with flaky retry
        id: test
        continue-on-error: true
        run: |
          : > ci-test.log
          test_flaky=false
          test_passed=false
          for attempt in 1 2; do
            attempt_log="ci-test-attempt-${attempt}.log"
            echo "=== Vitest attempt ${attempt}/2 ===" | tee -a ci-test.log
            set +e
            npm test > "$attempt_log" 2>&1
            status=$?
            set -e
            cat "$attempt_log" | tee -a ci-test.log
            if [ "$status" -eq 0 ]; then
              test_passed=true
              if [ "$attempt" -eq 2 ]; then test_flaky=true; fi
              break
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "First test attempt failed; rerunning once to detect a flaky failure." | tee -a ci-test.log
            fi
          done
          echo "flaky=${test_flaky}" >> "$GITHUB_OUTPUT"
          echo "passed=${test_passed}" >> "$GITHUB_OUTPUT"
          if [ "$test_passed" != true ]; then exit 1; fi
      - name: Run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-build.log
        continue-on-error: true
        id: build
      - name: Collect diagnostic summary
        if: always()
        id: diagnostics
        run: |
          {
            echo "# CI diagnostic summary"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo
            echo "## Step outcomes"
            echo "- install: ${{ steps.install.outcome }}"
            echo "- audit: ${{ steps.audit.outcome }}"
            echo "- citations: ${{ steps.citations.outcome }}"
            echo "- kb-validate: ${{ steps.kb_validate.outcome }}"
            echo "- lint: ${{ steps.lint.outcome }}"
            echo "- typecheck: ${{ steps.typecheck.outcome }}"
            echo "- test: ${{ steps.test.outcome }}"
            echo "- test flaky: ${{ steps.test.outputs.flaky }}"
            echo "- build: ${{ steps.build.outcome }}"
            echo
            echo "## Failure excerpts"
            for log in ci-install.log ci-audit.log ci-citations.log ci-kb-validate.log ci-lint.log ci-typecheck.log ci-test.log ci-test-attempt-1.log ci-test-attempt-2.log ci-build.log; do
              if [ -f "$log" ]; then
                echo
                echo "### $log"
                grep -E -i -m 20 'error|fail|failed|failing|exception|assert| ✘ |✖|vulnerabilit' "$log" || tail -n 20 "$log"
              fi
            done
          } > ci-diagnostic-summary.md
          cat ci-diagnostic-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            ci-*.log
            ci-diagnostic-summary.md
          retention-days: 14
      - name: Fail the job if any gate failed
        if: always()
        run: |
          if [ "${{ steps.install.outcome }}" = "failure" ] || [ "${{ steps.audit.outcome }}" = "failure" ] || [ "${{ steps.citations.outcome }}" = "failure" ] || [ "${{ steps.kb_validate.outcome }}" = "failure" ] || [ "${{ steps.lint.outcome }}" = "failure" ] || [ "${{ steps.typecheck.outcome }}" = "failure" ] || [ "${{ steps.test.outcome }}" = "failure" ] || [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "One or more CI gates failed. See the diagnostic summary and artifact."
            exit 1
          fi
