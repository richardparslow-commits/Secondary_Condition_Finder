name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sentinel_acceptance:
        description: "Run the optional acceptance sentinel job (own dev server + real browser)"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    # The PRIV-01 sentinel is its own job now (see `priv01_sentinel`), so this
    # ceiling no longer pays for a walk that starts a dev server, drives Chrome
    # and runs page-side OCR. It still covers install + full suite + build + the
    # four real-browser E2E journeys, so it drops by less than the walk's own
    # worst case: neither job can spend the other's time, and the walk cannot
    # truncate every other gate into an opaque job cancellation. A CI
    # measurement should replace the estimate, the way the fleet budget ratchet
    # is derived rather than chosen.
    needs: [priv01_scope, priv01_sentinel]
    # `always()` is load-bearing, not defensive: with the default `success()`
    # condition a failed `priv01_sentinel` would *skip* this job, a skipped
    # required check is not a failed one, and the pull request could merge with
    # the walk red. The aggregator below turns that failure into a failure of
    # the single required context branch protection already watches (`verify`).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Verify main commit came through a merged PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: governance
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node --input-type=module - <<'NODE' 2>&1 | tee ci-governance.log
          const apiUrl = process.env.GITHUB_API_URL;
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const token = process.env.GH_TOKEN;
          const url = `${apiUrl}/repos/${repository}/commits/${sha}/pulls`;

          let lastError = "No merged PR association found.";
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            try {
              const response = await fetch(url, {
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${token}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                },
              });
              if (!response.ok) {
                throw new Error(`GitHub commit/pulls lookup returned HTTP ${response.status}`);
              }

              const pulls = await response.json();
              const accepted = Array.isArray(pulls) && pulls.some((pull) =>
                Boolean(pull?.merged_at) &&
                pull?.base?.ref === "main" &&
                pull?.merge_commit_sha === sha,
              );
              if (accepted) {
                console.log(`main governance passed: ${sha} is the merge commit of a merged PR targeting main.`);
                process.exit(0);
              }
              lastError = `Attempt ${attempt}: ${sha} is not yet associated with a merged PR targeting main.`;
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
            }

            if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, 2000));
          }

          console.error(`main governance failed: ${lastError}`);
          console.error("Direct pushes to main do not satisfy the repository's reviewed-PR production lineage policy.");
          process.exit(1);
          NODE
      - name: Verify active main governance rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: branch_rules
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node --input-type=module - <<'NODE' 2>&1 | tee ci-branch-rules.log
          const apiUrl = process.env.GITHUB_API_URL;
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };

          const branchResponse = await fetch(`${apiUrl}/repos/${repository}/branches/main`, { headers });
          if (!branchResponse.ok) {
            console.error(`main governance rules failed: branch lookup returned HTTP ${branchResponse.status}.`);
            process.exit(1);
          }
          const branch = await branchResponse.json();
          if (branch?.protected !== true) {
            console.error("main governance rules failed: GitHub reports main as unprotected.");
            process.exit(1);
          }

          const rulesResponse = await fetch(`${apiUrl}/repos/${repository}/rules/branches/main`, { headers });
          if (!rulesResponse.ok) {
            console.error(`main governance rules failed: active-rules lookup returned HTTP ${rulesResponse.status}.`);
            process.exit(1);
          }
          const rules = await rulesResponse.json();
          if (!Array.isArray(rules)) {
            console.error("main governance rules failed: active-rules payload was not an array.");
            process.exit(1);
          }

          const requiredRuleTypes = [
            "pull_request",
            "required_status_checks",
            "non_fast_forward",
            "deletion",
          ];
          const ruleTypes = new Set(rules.map((rule) => rule?.type).filter(Boolean));
          const missingRuleTypes = requiredRuleTypes.filter((type) => !ruleTypes.has(type));
          if (missingRuleTypes.length > 0) {
            console.error(`main governance rules failed: missing active rule type(s): ${missingRuleTypes.join(", ")}.`);
            process.exit(1);
          }

          const requiredChecks = rules
            .filter((rule) => rule?.type === "required_status_checks")
            .flatMap((rule) => rule?.parameters?.required_status_checks ?? []);
          const verifyRequired = requiredChecks.some((check) => check?.context === "verify");
          if (!verifyRequired) {
            console.error('main governance rules failed: required status check "verify" is not active for main.');
            process.exit(1);
          }

          console.log('main governance rules passed: PR-only changes, required "verify", force-push blocking, and deletion blocking are active.');
          NODE
      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ci-install.log
        continue-on-error: true
        id: install
      # Enforced gate: production (runtime) dependencies must have zero
      # high/critical advisories. Dev-only tooling advisories with no upstream
      # patch are inventoried by the non-blocking step below instead of
      # silently weakening this gate: the previous braces <= 3.0.3 advisory
      # has "Patched versions: None", so a full-tree --audit-level=high gate
      # cannot pass through upgrades and must not be loosened to pass.
      - name: Audit high-severity production dependencies
        run: |
          set -o pipefail
          npm run audit:high 2>&1 | tee ci-audit.log
        continue-on-error: true
        id: audit
      # Informational only: this step is deliberately NOT marked
      # continue-on-error (the CI wiring test requires every such step to be
      # re-failed by the aggregator), so it cannot fail the job on its own. It
      # still records the full dependency tree, including dev tooling, for the
      # diagnostic summary and artifact.
      - name: Inventory full-tree dependency advisories (non-blocking)
        run: |
          set -o pipefail
          npm run audit:high:all 2>&1 | tee ci-audit-all.log || true
        id: audit_all_inventory
      # A10 (audit issue list, item 25). The inventory step above is a log line,
      # so an advisory with no published fix could not block a merge and was
      # indistinguishable from no advisory at all. This gate holds every
      # advisory the full-tree audit reports to a dated, evidence-based record
      # in docs/dependency-advisory-disposition.json, and fails on unclassified
      # debt or on a record that no longer matches the tree. Severity
      # enforcement for production dependencies stays with `audit:high` above;
      # this gate governs inventory completeness, classification and freshness.
      - name: Gate dependency advisory dispositions (A10)
        run: |
          set -o pipefail
          npm run audit:disposition 2>&1 | tee ci-audit-disposition.log
        continue-on-error: true
        id: audit_disposition
      - name: Audit citation verification
        run: |
          set -o pipefail
          npm run citations:audit 2>&1 | tee ci-citations.log
        continue-on-error: true
        id: citations
      - name: Validate knowledge base
        run: |
          set -o pipefail
          npm run kb:validate 2>&1 | tee ci-kb-validate.log
        continue-on-error: true
        id: kb_validate
      - name: Audit ME / CRG compliance
        run: |
          set -o pipefail
          npm run audit:me-compliance 2>&1 | tee ci-me-compliance.log
        continue-on-error: true
        id: me_compliance
      # CRG structural integrity: self-loops, duplicate edges, and pure
      # DIRECT_CAUSATION cycles are hard violations, and the review/redundancy
      # backlogs are ratcheted so they cannot grow silently. Not previously
      # executed by any workflow, which left the audit's FAIL path unreachable.
      - name: Audit CRG graph structure
        run: |
          set -o pipefail
          npm run audit:crg 2>&1 | tee ci-crg.log
        continue-on-error: true
        id: crg
      # Adjacency-graph cycle gate over data/knowledge-base/graph/. Vacuous
      # (with an explicit warning) only while the graph directory is empty;
      # the first node migrated 2026-10-03, so this runs hard over live data.
      - name: Audit CRG adjacency graph
        run: |
          set -o pipefail
          npm run audit:crg:graph 2>&1 | tee ci-crg-graph.log
        continue-on-error: true
        id: crg_graph
      - name: Run lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ci-lint.log
        continue-on-error: true
        id: lint
      - name: Run typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-typecheck.log
        continue-on-error: true
        id: typecheck
      - name: Audit critical-module test composition
        run: |
          set -o pipefail
          npm run test:composition 2>&1 | tee ci-test-composition.log
        continue-on-error: true
        id: test_composition
      - name: Run tests once and fail on any test failure
        id: test
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_secondary_evidence_discovery.py' 2>&1 | tee ci-secondary-evidence.log
          python3 -m unittest discover -s tests -p 'test_candidate_publication_preflight.py' 2>&1 | tee ci-candidate-metadata.log
          npm test 2>&1 | tee ci-test.log
      # Focused coordination gate: the fleet simulation holds 30–40 simulated
      # instances to the shared-cache, single-flight, circuit, invalidation,
      # outage, and degraded-store invariants. Those invariants are latency
      # properties too, so this named gate runs the simulation under a derived
      # wall-clock budget (scripts/run-fleet-simulation.mjs). The budget is a
      # ratchet, not a constant: it is derived from committed measurements of
      # this suite and only ever tightens, so it cannot silently drift looser
      # as the suite grows. A coordination regression that becomes unbounded is
      # killed and fails the build with its own log, rather than only taking
      # the test suite longer.
      #
      # --record appends this runner's real measurement to the ratchet state
      # and lowers the cap to the derived budget. The run still fails on a real
      # failure or overrun; the ratchet file is never a reason to fail. The CI
      # window is ratified once this file is committed with a "ci" entry, so
      # `npm run test:fleet -- --record` on a CI runner is what tightens it —
      # see .github/fleet-budget-ratchet.json. The updated state is uploaded
      # with the diagnostics so a maintainer can commit the CI measurement.
      - name: Run VA fleet simulation under a ratcheted wall-clock budget
        run: |
          set -o pipefail
          npm run test:fleet -- --record 2>&1 | tee ci-fleet.log
        continue-on-error: true
        id: fleet
      - name: Run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-build.log
        continue-on-error: true
        id: build
      # Deployment-artifact gate over the build's output-file traces (REL-03).
      # A successful `next build` says nothing about what the artifact contains:
      # a dynamic filesystem read makes Turbopack trace the whole project, so
      # source/tests/docs/scratch files get shipped — and a trace that omits a
      # file the runtime reads fails only at the first production request. Both
      # were real (REL-03 shipped the whole project in three traces) and both
      # are invisible until deployment, so this reads the build output directly.
      # Skipped when the build failed, because there is no artifact to audit and
      # the build already fails the job.
      - name: Audit deployment artifact traces
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          npm run audit:traces -- --json=ci-artifact-traces.json 2>&1 | tee ci-artifact-traces.log
        continue-on-error: true
        id: artifact_traces
      - name: Run real-browser E2E workflow
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          (node e2e/secondary-workflow.mjs && node e2e/validation-errors.mjs && node e2e/coi-isolation.mjs && node e2e/pathways-smoke.mjs) 2>&1 | tee ci-e2e.log
        continue-on-error: true
        id: e2e
      # R-05 (VA Lighthouse §5.5): real-browser axe color-contrast with the
      # rule jsdom cannot compute, plus a keyboard visible-focus walk, across
      # every shipped route. Same WebDriver/chromedriver stack as the journeys
      # above; axe is evaluated via WebDriver script (not a DOM script sink),
      # so the Trusted Types gate needs no relaxation (pinned by
      # tests/a11y-contrast-gate.test.ts). Failures include the offending
      # selector and ratio; raw axe reports are uploaded as artifacts.
      - name: Run real-browser contrast and keyboard gate (R-05)
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          status=0
          node e2e/a11y-contrast.mjs 2>&1 | tee ci-a11y-contrast.log || status=$?
          # Publish this run's route inventory (each route's declared surfaces
          # against the evidence actually recorded) in the run's own summary:
          # the table holds one row per declared route whether or not the walk
          # reached it, so a route the gate silently stopped covering is visible
          # here as well as in the uploaded a11y-evidence/ artifact.
          if [ -f a11y-evidence/route-inventory-report.md ]; then
            {
              echo
              echo "## Per-run route inventory (R-05 contrast surface)"
              echo
              cat a11y-evidence/route-inventory-report.md
            } >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit "$status"
        continue-on-error: true
        id: a11y_contrast
      # Full-rule axe pass over every shipped route in Playwright. R-05 runs
      # only the two rules that need a layout engine, and the jsdom gate never
      # renders a page; this gate runs the WCAG 2.1 A/AA rule set against the
      # production build of every route declared by `public-routes.mjs` and
      # fails on serious/critical violations. It uses the runner's installed
      # Chrome channel, so it adds a second real-browser check without
      # downloading a second browser binary.
      - name: Run Playwright axe gate on every route
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          npm run a11y:full 2>&1 | tee ci-a11y-full.log
        continue-on-error: true
        id: a11y_full
      # REL-05: the hostile-file browser stress run the audit recorded as its one
      # unrun evidence clause. It drives the production build's browser-local
      # DD-214 analyzer with declared-size image bombs, a malformed PDF, repeated
      # refusals under heap measurement, and a stalled OCR worker that Cancel
      # must terminate. It found a real defect on its first run (a worker stalled
      # during initialization survived cancel); the fix is pinned by
      # tests/local-ocr-worker-spawn.test.ts. Evidence lands in the artifact.
      - name: Run hostile-file browser stress test (REL-05)
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          npm run stress:hostile 2>&1 | tee ci-hostile-stress.log
        continue-on-error: true
        id: hostile_stress
      # Release gate for the Sites Worker: the OCR model is served through the
      # `/tesseract/eng.traineddata.gz` rewrite, and a regression there is only
      # observable in the built Worker under workerd — jsdom, Node and the route
      # tests all see the source, not the artifact the Sites upload contains.
      # `--sites` builds with the Sites OpenNext config and bindings and asserts
      # the rewrite's 200, gzip content type, immutable cache policy, single
      # nosniff/CORP headers, `OCR_MODEL_SHA256` digest match against both the
      # route and the pinned package copy, and that no `public/` copy can mask
      # the rewrite. CI has no checkout prepared by Sites — the generated
      # `freebuff.open-next.config.ts` is gitignored — so it builds with the
      # committed equivalent in `scripts/ci/sites-open-next.config.ts`. The
      # aggregator below re-fails on this step, so a red smoke blocks the merge.
      - name: Run Sites Worker smoke check (OCR rewrite gate)
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          npm run smoke:worker -- --sites --sites-config scripts/ci/sites-open-next.config.ts 2>&1 | tee ci-sites-worker-smoke.log
        continue-on-error: true
        id: sites_worker_smoke
      - name: Collect diagnostic summary
        if: always()
        id: diagnostics
        run: |
          {
            echo "# CI diagnostic summary"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo
            echo "## Step outcomes"
            echo "- main-governance: ${{ steps.governance.outcome }}"
            echo "- main-governance-rules: ${{ steps.branch_rules.outcome }}"
            echo "- install: ${{ steps.install.outcome }}"
            echo "- audit (production deps): ${{ steps.audit.outcome }}"
            echo "- audit-all (informational): ${{ steps.audit_all_inventory.outcome }}"
            echo "- audit-disposition (A10): ${{ steps.audit_disposition.outcome }}"
            echo "- citations: ${{ steps.citations.outcome }}"
            echo "- kb-validate: ${{ steps.kb_validate.outcome }}"
            echo "- me-compliance: ${{ steps.me_compliance.outcome }}"
            echo "- crg-structure: ${{ steps.crg.outcome }}"
            echo "- crg-adjacency: ${{ steps.crg_graph.outcome }}"
            echo "- lint: ${{ steps.lint.outcome }}"
            echo "- typecheck: ${{ steps.typecheck.outcome }}"
            echo "- test-composition: ${{ steps.test_composition.outcome }}"
            echo "- test: ${{ steps.test.outcome }}"
            echo "- fleet-coordination: ${{ steps.fleet.outcome }}"
            echo "- build: ${{ steps.build.outcome }}"
            echo "- artifact-traces: ${{ steps.artifact_traces.outcome }}"
            echo "- browser-e2e: ${{ steps.e2e.outcome }}"
            echo "- browser-a11y-contrast (R-05): ${{ steps.a11y_contrast.outcome }}"
            echo "- browser-a11y-full (Playwright): ${{ steps.a11y_full.outcome }}"
            echo "- hostile-file-stress (REL-05): ${{ steps.hostile_stress.outcome }}"
            echo "- sites-worker-smoke (OCR rewrite): ${{ steps.sites_worker_smoke.outcome }}"
            echo "- priv01-scope job: ${{ needs.priv01_scope.result }}"
            echo "- priv01-sentinel job: ${{ needs.priv01_sentinel.result }}"
            echo
            echo "## Failure excerpts"
            for log in ci-governance.log ci-branch-rules.log ci-install.log ci-audit.log ci-audit-all.log ci-audit-disposition.log ci-citations.log ci-kb-validate.log ci-me-compliance.log ci-crg.log ci-crg-graph.log ci-lint.log ci-typecheck.log ci-test-composition.log ci-test.log ci-fleet.log ci-build.log ci-artifact-traces.log ci-e2e.log ci-a11y-contrast.log ci-a11y-full.log ci-hostile-stress.log ci-sites-worker-smoke.log; do
              if [ -f "$log" ]; then
                echo
                echo "### $log"
                grep -E -i -m 20 'error|fail|failed|failing|exception|assert| ✘ |✖|vulnerabilit' "$log" || tail -n 20 "$log"
              fi
            done
            if [ -f .github/fleet-budget-ratchet.json ]; then
              echo
              echo "### fleet budget ratchet state (committed seed)"
              cat .github/fleet-budget-ratchet.json
            fi
            echo
            echo "## Ratchet the fleet budget: commit .github/fleet-budget-ratchet.json"
            echo
            echo "The fleet gate re-derives its wall-clock budget from committed measurements and only ever tightens."
            echo "The uploaded .github/fleet-budget-ratchet.json carries this run's measurement; committing it ratifies the window."
            echo "Use --record deliberately: it is the only path that moves a budget cap."
          } > ci-diagnostic-summary.md
          cat ci-diagnostic-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            ci-*.log
            ci-diagnostic-summary.md
            ci-artifact-traces.json
            ci-priv01-sentinel-evidence.json
            a11y-evidence/
            tmp/hostile-file-stress/
            .github/fleet-budget-ratchet.json
          retention-days: 14
      - name: Fail the job if any gate failed
        if: always()
        run: |
          # The scope job must have succeeded: if it failed, `priv01_sentinel`
          # is skipped, and "the filter never answered" must not read as "the
          # change set was out of scope".
          if [ "${{ needs.priv01_scope.result }}" != "success" ] || \
             [ "${{ needs.priv01_sentinel.result }}" = "failure" ] || \
             [ "${{ needs.priv01_sentinel.result }}" = "cancelled" ] || \
             [ "${{ steps.governance.outcome }}" = "failure" ] || [ "${{ steps.branch_rules.outcome }}" = "failure" ] || [ "${{ steps.install.outcome }}" = "failure" ] || [ "${{ steps.audit.outcome }}" = "failure" ] || [ "${{ steps.audit_disposition.outcome }}" = "failure" ] || [ "${{ steps.citations.outcome }}" = "failure" ] || [ "${{ steps.kb_validate.outcome }}" = "failure" ] || [ "${{ steps.me_compliance.outcome }}" = "failure" ] || [ "${{ steps.crg.outcome }}" = "failure" ] || [ "${{ steps.crg_graph.outcome }}" = "failure" ] || [ "${{ steps.lint.outcome }}" = "failure" ] || [ "${{ steps.typecheck.outcome }}" = "failure" ] || [ "${{ steps.test_composition.outcome }}" = "failure" ] || [ "${{ steps.test.outcome }}" = "failure" ] || [ "${{ steps.fleet.outcome }}" = "failure" ] || [ "${{ steps.build.outcome }}" = "failure" ] ||             [ "${{ steps.artifact_traces.outcome }}" = "failure" ] || [ "${{ steps.e2e.outcome }}" = "failure" ] || [ "${{ steps.a11y_contrast.outcome }}" = "failure" ] ||             [ "${{ steps.a11y_full.outcome }}" = "failure" ] || [ "${{ steps.hostile_stress.outcome }}" = "failure" ] || [ "${{ steps.sites_worker_smoke.outcome }}" = "failure" ]; then
            echo "One or more CI gates failed. See the diagnostic summary and artifact."
            exit 1
          fi
  # Path filter for the PRIV-01 sentinel, and the reason the sentinel is a job
  # rather than a step: a workflow skipped by path filtering leaves its required
  # checks stuck at "Expected" forever, so the filtering has to happen inside a
  # run that always starts. This job always runs, answers exactly one question —
  # does this change set need the walk? — and the walk job is skipped or run
  # from that answer. Detection fails closed: a change set it cannot read runs
  # the gate instead of skipping it, and every non-PR event (push to main,
  # manual dispatch) runs it, because that is where the contract has to hold.
  priv01_scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The scope list lives in scripts/priv01-sentinel-scope.mjs so the wiring
      # test can prove it still covers every load-bearing module. The verdict is
      # printed and written to the run summary: the job that consumes it is a
      # different job, so the reason must be readable from the run itself.
      - name: Detect PRIV-01 sentinel scope changes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          node --input-type=module - <<'NODE'
          import { appendFileSync } from "node:fs";

          const { priv01SentinelScopeMatches } = await import(
            "./scripts/priv01-sentinel-scope.mjs",
          );

          const setOutput = (changed, reason) => {
            const line = `priv01-sentinel scope: changed=${changed} (${reason})`;
            console.log(line);
            if (process.env.GITHUB_STEP_SUMMARY) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`);
            }
            if (process.env.GITHUB_OUTPUT) {
              appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
            }
          };

          try {
            const eventName = process.env.GITHUB_EVENT_NAME ?? "";
            if (eventName !== "pull_request") {
              // A push to main or a manual dispatch is where the contract has to
              // hold outright, so the walk runs without consulting a change set.
              setOutput("true", `${eventName || "non-PR"} event: the contract has to hold here`);
            } else {
              const apiUrl = process.env.GITHUB_API_URL;
              const repository = process.env.GITHUB_REPOSITORY;
              const number = process.env.PR_NUMBER;
              const headers = {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
              };
              const changedFiles = [];
              // The PR files endpoint paginates at 100; a pull request larger than
              // 3000 files is not worth an unbounded loop, so the last page read
              // decides (fail closed).
              for (let page = 1; page <= 30; page += 1) {
                const response = await fetch(
                  `${apiUrl}/repos/${repository}/pulls/${number}/files?per_page=100&page=${page}`,
                  { headers },
                );
                if (!response.ok) {
                  throw new Error(`pull files lookup returned HTTP ${response.status}`);
                }
                const batch = await response.json();
                if (!Array.isArray(batch)) {
                  throw new Error("pull files payload was not an array");
                }
                changedFiles.push(
                  ...batch
                    .map((entry) => entry?.filename)
                    .filter((name) => typeof name === "string"),
                );
                if (batch.length < 100) break;
              }

              const inScope = priv01SentinelScopeMatches(changedFiles);
              setOutput(
                inScope.length > 0 ? "true" : "false",
                inScope.length > 0
                  ? `${inScope.length} in-scope file(s)`
                  : `${changedFiles.length} file(s) changed, none in scope`,
              );
            }
          } catch (error) {
            setOutput(
              "true",
              `change-set lookup failed (${error instanceof Error ? error.message : String(error)}); running the gate`,
            );
          }
          NODE

  # PRIV-01 stage 4 as an enforced, attributable job with its own time budget.
  #
  # The walk plants unique sentinels in every private field and fails on one
  # reaching any request, response, HTML/RSC payload, log, trace or storage
  # surface — the one check that cannot be satisfied by reading source. It needs
  # a live app, so this job starts its own dev server and points the runner at
  # that server's log, because the walk scans the server log it drove.
  #
  # Why its own job: the walk is the workflow's slowest and most
  # environment-dependent gate. Sharing `verify`'s ceiling meant a wedged walk
  # spent the budget every other gate needed, and a `verify` timeout truncated
  # the walk into a job cancellation rather than a diagnosis. The ceiling below
  # covers this job only, and the walk inside it has its own smaller budget, so
  # the two can never spend each other's time.
  #
  # Why it is still required: `verify` needs this job and fails when the job
  # fails, so enforcement stays on the one context branch protection already
  # requires, and a skipped job (an out-of-scope pull request) is not a failure.
  priv01_sentinel:
    needs: priv01_scope
    if: needs.priv01_scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # Derived, not picked: install (≤5 min) + browser preflight (<1) + dev server
    # ready (its own 120 s loop) + the walk (15-minute step budget of its own,
    # whose bounded waits fail diagnosably long before this) + evidence upload
    # (≤1) ≈ 20. It is a backstop for a hang outside the walk's polling loop,
    # which the walk now reports as `STALLED` heartbeat lines rather than as
    # silence.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ci-priv01-sentinel-install.log
      # A missing browser is a gate failure, not a skip: a green run must mean
      # the walk actually happened. This is its own step so the failure is
      # attributed to the runner's capability rather than to the walk.
      - name: Confirm the runner can host the walk
        run: |
          set -o pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No Chrome/Chromium binary on this runner; the PRIV-01 sentinel gate cannot drive a browser." | tee ci-priv01-sentinel.log
            exit 1
          fi
          echo "CHROME_PATH=$browser" >> "$GITHUB_ENV"
          echo "Driving the walk with $browser"
      # Started here and stopped in the `always()` step below, so the walk can be
      # its own step with its own budget while still pointing at the log of the
      # server it drove.
      - name: Start the app the walk drives
        id: server
        run: |
          set -o pipefail
          npm run dev -- -H 127.0.0.1 -p 3117 > ci-priv01-sentinel-server.log 2>&1 &
          echo "server_pid=$!" >> "$GITHUB_OUTPUT"
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3117/api/health" > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "The dev server never answered /api/health; see ci-priv01-sentinel-server.log." | tee ci-priv01-sentinel.log
            exit 1
          fi
          echo "Dev server answered /api/health on 127.0.0.1:3117"
      - name: Run PRIV-01 stage-4 browser sentinel
        id: priv01_sentinel
        # The walk's own bounded waits (90 s page conditions, a 240 s OCR
        # deadline, 60 s CDP sends) all sit inside this, so an overrun here is a
        # hang outside the polling loop — which the heartbeat lines in the log
        # report as `STALLED:no-progress` rather than as a silent job kill.
        timeout-minutes: 15
        env:
          SENTINEL_APP_BASE: "http://127.0.0.1:3117"
          SENTINEL_SERVER_LOG: ${{ github.workspace }}/ci-priv01-sentinel-server.log
          SENTINEL_REPORT_PATH: ${{ github.workspace }}/ci-priv01-sentinel-evidence.json
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -o pipefail
          node scripts/acceptance-browser-sentinel.mjs 2>&1 | tee ci-priv01-sentinel.log
      # The heartbeat lines are the walk's own progress record: they name the
      # phase, the wait, the probe count and whether the polled target was still
      # answering, so a wedged walk is diagnosable from the run itself and not
      # only from a downloaded artifact.
      - name: Summarize where the walk stopped
        if: always()
        run: |
          {
            echo "## PRIV-01 stage-4 sentinel"
            echo
            echo "Walk outcome: ${{ steps.priv01_sentinel.outcome }}"
            echo "Server step: ${{ steps.server.outcome }}"
            echo
            if [ -f ci-priv01-sentinel.log ]; then
              echo "### Phases, heartbeats and stalls"
              echo '```'
              grep -E '^(phase|progress) |STALLED|^FAIL' ci-priv01-sentinel.log | tail -n 25 || true
              echo '```'
              echo "### Walk log tail"
              echo '```'
              tail -n 25 ci-priv01-sentinel.log
              echo '```'
            else
              echo "No walk log; the job failed before the walk started."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop the app the walk drove
        if: always()
        run: |
          if [ -n "${{ steps.server.outputs.server_pid }}" ]; then
            kill "${{ steps.server.outputs.server_pid }}" 2>/dev/null || true
          fi
          if command -v lsof > /dev/null 2>&1; then
            lsof -ti tcp:3117 | xargs -r kill 2>/dev/null || true
          fi
      - name: Upload the sentinel evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: priv01-sentinel-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ci-priv01-sentinel.log
            ci-priv01-sentinel-server.log
            ci-priv01-sentinel-evidence.json
            ci-priv01-sentinel-install.log
          retention-days: 14

  # Optional, opt-in: the same acceptance walk the `verify` job runs, but driven
  # end-to-end through its own npm entrypoint (scripts/run-acceptance-sentinel.mjs),
  # which starts and stops its own dev server and exits non-zero on regression.
  #
  # This job is deliberately outside the merge path: it is not in the `verify`
  # aggregator, and it runs only when a manual dispatch opts in
  # (`sentinel_acceptance=true`), because it pays for a dev server, a real
  # browser and page-side OCR. Its point is repeatability: an operator or a
  # future scheduled run gets one command, one exit status and one evidence
  # artifact, instead of a shell block that only exists inside another job.
  sentinel-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.sentinel_acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Deliberately NOT `continue-on-error`: this job has no aggregator of its
      # own, and a walk that fails has to fail the job. The evidence upload below
      # uses `if: always()`, so it still runs when the walk regresses.
      - name: Run the acceptance sentinel through its npm entrypoint
        id: sentinel_entrypoint
        run: |
          set -o pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No Chrome/Chromium binary on this runner; the acceptance walk cannot drive a browser." | tee acceptance-sentinel.log
            exit 1
          fi
          CHROME_PATH="$browser" \
          npm run acceptance:sentinel -- \
            --port 3117 \
            --server-log "$PWD/acceptance-sentinel-server.log" \
            --report "$PWD/acceptance-sentinel-evidence.json" 2>&1 | tee acceptance-sentinel.log
      - name: Upload the acceptance evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: acceptance-sentinel-evidence
          if-no-files-found: warn
          path: |
            acceptance-sentinel.log
            acceptance-sentinel-server.log
            acceptance-sentinel-evidence.json
          retention-days: 14
