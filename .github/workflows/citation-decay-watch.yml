name: Citation Decay Watch

# Scheduled link-rot / staleness / content-drift probe over the knowledge
# base's live references. Deliberately NOT a per-PR gate (matching the
# maintainer-gate posture of npm run citations:decay): this workflow runs
# weekly so verification debt surfaces immediately instead of accumulating
# silently. A qualified human still performs every verification decision
# under docs/citation-verification-sop.md — automation only opens and
# maintains the tracking issue.

on:
  schedule:
    # Mondays 06:07 UTC — off-the-hour to avoid scheduled-run thundering herds.
    - cron: "7 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citation-decay-watch
  cancel-in-progress: false

jobs:
  decay-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run citation decay probe
        id: probe
        run: |
          set -o pipefail
          npm run citations:decay 2>&1 | tee citation-decay-report.json
          exit_code=$?
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const report = JSON.parse(readFileSync('citation-decay-report.json', 'utf8'));
            const summary = [
              '# Citation decay report',
              '',
              '- status: ' + report.status,
              '- live references: ' + report.liveReferences,
              '- link rot: ' + report.linkRotCount,
              '- content drift: ' + report.contentDriftCount,
              '- stale (tiered windows): ' + report.staleCount,
              '- bot-blocked (unverifiable by probe): ' + report.botBlockedUnverifiableCount,
              '- unverified: ' + report.unverifiedCount,
              '- ceiling usage: ' + report.citationCeilingUsage + '/' + report.citationCeiling,
              '',
              'See the uploaded artifact for the full JSON report.',
            ].join('\n') + '\n';
            writeFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          " || true
          exit $exit_code
      - name: Upload decay report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: citation-decay-report-${{ github.run_id }}
          path: citation-decay-report.json
          retention-days: 30

  track-decay:
    needs: decay-probe
    if: always() && needs.decay-probe.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The report is written in the decay-probe workspace; fetch it from the
      # run's artifacts so this job can build the tracking-issue body.
      - name: Download decay report artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: citation-decay-report-${{ github.run_id }}
      - name: Open or update citation decay tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node --input-type=module - <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";

          const report = JSON.parse(readFileSync("citation-decay-report.json", "utf8"));
          const title = "Citation decay detected — re-verification required";
          const marker = "<!-- citation-decay-watch -->";

          const top = (entries, field) =>
            entries.slice(0, 10).map((entry) => `- \`${entry.primary}\` → \`${entry.target}\`: ${entry[field] ?? entry.citation ?? entry.sourceUrl ?? ""}`);

          const body = [
            marker,
            "The scheduled citation decay probe failed. A qualified human must",
            "re-verify or withdraw the flagged references under",
            "docs/citation-verification-sop.md. This issue is maintained by the",
            "citation-decay-watch workflow; it updates in place while decay",
            "persists and is not auto-closed.",
            "",
            `| metric | count |`,
            `| --- | --- |`,
            `| link rot | ${report.linkRotCount} |`,
            `| content drift | ${report.contentDriftCount} |`,
            `| stale | ${report.staleCount} |`,
            `| unverified | ${report.unverifiedCount} |`,
            `| ceiling usage | ${report.citationCeilingUsage}/${report.citationCeiling} |`,
            "",
            "## Decayed (dead) links",
            ...(report.decayed.length ? top(report.decayed, "sourceUrl") : ["- none"]),
            "",
            "## Content drift (digest mismatch at HTTP 200)",
            ...(report.contentDrift.length ? top(report.contentDrift, "sourceUrl") : ["- none"]),
            "",
            "## Stale (past tiered window)",
            ...(report.stale.length ? top(report.stale, "citation") : ["- none"]),
            "",
            `Run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            "",
          ].join("\n");

          const gh = (args) => execFileSync("gh", args, { encoding: "utf8" });
          const existing = gh([
            "issue", "list",
            "--state", "open",
            "--search", title + " in:title",
            "--json", "number,title",
          ]).trim();
          const matches = JSON.parse(existing || "[]").filter((issue) => issue.title === title);

          if (matches.length > 0) {
            gh(["issue", "edit", String(matches[0].number), "--body", body]);
            console.log(`Updated tracking issue #${matches[0].number}`);
          } else {
            gh(["issue", "create", "--title", title, "--body", body]);
            console.log("Opened new tracking issue");
          }
          NODE
