name: Citation Decay Watch

# Scheduled link-rot / staleness / content-drift probe over the knowledge
# base's live references. Deliberately NOT a per-PR gate (matching the
# maintainer-gate posture of npm run citations:decay): this workflow runs
# weekly so verification debt surfaces immediately instead of accumulating
# silently. A qualified human still performs every verification decision
# under docs/citation-verification-sop.md — automation only opens and
# maintains the tracking issue.

on:
  schedule:
    # Mondays 06:07 UTC — off-the-hour to avoid scheduled-run thundering herds.
    - cron: "7 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citation-decay-watch
  cancel-in-progress: false

jobs:
  decay-probe:
    runs-on: ubuntu-latest
    # 60 minutes, not 20. The sweep probes every unique live URL twice (HEAD,
    # then GET) through a 4-worker pool with a per-host spacing floor, so its
    # wall time is ~1.7k URLs at >=600 ms spacing (plus each host's response
    # time, the adaptive back-off after throttling, and bounded host
    # cooldowns). That is comfortably past the old 20-minute budget, which
    # cancelled the job mid-sweep and reported nothing at all -- the same
    # false-negative shape the probe fixes below, one layer up. A host that
    # keeps asking for quiet is dropped for the remainder of the run rather
    # than out-waited, so throttling shortens this job instead of extending it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run citation decay probe
        id: probe
        run: |
          set -o pipefail
          # Silencing npm's script banner keeps the captured report pure JSON.
          # The 2026-09-28 run uploaded the '> secondary-condition-finder@0.1.0
          # citations:decay' banner ahead of the report, so track-decay's
          # JSON.parse died on it and the tracking issue was never opened.
          npm_config_loglevel=silent npm run citations:decay 2>&1 | tee citation-decay-report.json
          exit_code=$?
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            // Tolerate a leading banner: this must still parse if npm ever
            // prints one here again (see the probe step's comment).
            const raw = readFileSync('citation-decay-report.json', 'utf8');
            const report = JSON.parse(raw.slice(raw.indexOf('{')));
            const summary = [
              '# Citation decay report',
              '',
              '- status: ' + report.status,
              '- live references: ' + report.liveReferences,
              '- link rot: ' + report.linkRotCount,
              '- content drift: ' + report.contentDriftCount,
              '- content drift detectable: ' + report.contentDriftDetectable +
                ' (' + report.contentDriftCoveragePercent + '% of ' + report.verifiedReferenceCount +
                ' verified references carry a digest)',
              '- digest-eligible backlog: ' + report.digestEligibleWithoutDigestCount + ' of ' +
                report.digestEligibleReferenceCount + ' digest-eligible verified references await a ' +
                'qualified-human digest, ratchet ' + report.maxUndigestedEligibleVerifiedRefs,
              '- digest-ineligible (declared class, no digest possible): ' +
                report.digestIneligibleWithoutDigestCount + ' of ' + report.verifiedWithoutDigestCount +
                ' undigested; register reviewed ' + report.digestIneligibilityRegister.reviewedOn +
                ', expires ' + report.digestIneligibilityRegister.reviewExpiresOn,
              '- stale (tiered windows): ' + report.staleCount,
              '- bot-blocked (unverifiable by probe): ' + report.botBlockedUnverifiableCount,
              '- throttled / unresponsive (unverifiable by probe): ' + report.throttledUnverifiableCount,
              '- probe coverage (URLs that produced a verdict): ' + report.probeCoveragePercent + '% (' +
                report.definitiveVerdictUrlCount + ' of ' + report.uniqueUrlsProbed + ' probed URLs; ' +
                report.unverifiableByProbeUrlCount + ' could not be verified by this probe)',
              '- unverified (debt ratcheted by citations:audit, not gated here): ' + report.unverifiedCount,
              '- ceiling usage (link rot + stale + drift): ' + report.citationCeilingUsage + '/' + report.citationCeiling,
              '',
              'See the uploaded artifact for the full JSON report.',
            ].join('\n') + '\n';
            writeFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          " || true
          exit $exit_code
      - name: Upload decay report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: citation-decay-report-${{ github.run_id }}
          path: citation-decay-report.json
          retention-days: 30

  track-decay:
    needs: decay-probe
    # Runs after any completed probe so one job maintains both directions: it
    # opens or updates the tracking issue when the probe fails, and closes it
    # once a scheduled run is green — the pattern the scheduled dependency audit
    # already uses. Without the close half, a gate that failed on a signal it
    # could never clear would leave an issue asking a human to re-verify
    # references that had not decayed (issue #518, 2026-10-05).
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The report is written in the decay-probe workspace; fetch it from the
      # run's artifacts so this job can build the tracking-issue body. A probe
      # that never started (a cancelled or failed earlier step) uploads no
      # artifact at all, which is reported below rather than crashing here.
      - name: Download decay report artifact
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: citation-decay-report-${{ github.run_id }}
      - name: Maintain citation decay tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RESULT: ${{ needs.decay-probe.result }}
        run: |
          set -o pipefail
          node --input-type=module - <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";

          // Tolerate a leading banner (see the probe step's comment), and a
          // report that never arrived: a cancelled or timed-out sweep leaves an
          // empty capture, and an unstarted one leaves none. Either way this job
          // says so and leaves the issue alone, because a probe that did not
          // complete is not evidence of decay — it is exactly the false signal
          // this workflow exists to avoid. The probe job's own status reports
          // the failure.
          let report = null;
          try {
            const raw = readFileSync("citation-decay-report.json", "utf8");
            report = JSON.parse(raw.slice(raw.indexOf("{")));
          } catch {
            report = null;
          }
          if (!report) {
            console.log(
              `No usable decay report for this run (probe result: ${process.env.PROBE_RESULT}): the sweep did not complete, so no tracking-issue change was made.`,
            );
            process.exit(0);
          }
          const title = "Citation decay detected — re-verification required";
          const marker = "<!-- citation-decay-watch -->";

          const top = (entries, field) =>
            entries.slice(0, 10).map((entry) => `- \`${entry.primary}\` → \`${entry.target}\`: ${entry[field] ?? entry.citation ?? entry.sourceUrl ?? ""}`);

          const body = [
            marker,
            "The scheduled citation decay probe failed. A qualified human must",
            "re-verify or withdraw the flagged references under",
            "docs/citation-verification-sop.md. This issue is maintained by the",
            "citation-decay-watch workflow; it updates in place while decay",
            "persists and closes when a scheduled run is green again.",
            "",
            "**A reference listed as throttled or unresponsive was NOT checked**, so it was not",
            "found dead and nothing about it needs re-verifying: the host refused this run's",
            "automated probe (425/429, or any response carrying `Retry-After`) or never answered.",
            "Probe coverage below states how much of the sweep produced a verdict; a low figure",
            "means this run's \"no link rot\" is a narrower claim, not a clean one.",
            "",
            `| metric | count |`,
            `| --- | --- |`,
            `| link rot | ${report.linkRotCount} |`,
            `| content drift | ${report.contentDriftCount} |`,
            `| content drift detectable | ${report.contentDriftDetectable} (${report.contentDriftCoveragePercent}% of ${report.verifiedReferenceCount} verified references carry a digest) |`,
            `| digest-eligible backlog | ${report.digestEligibleWithoutDigestCount}/${report.digestEligibleReferenceCount} await a qualified-human digest (ratchet ${report.maxUndigestedEligibleVerifiedRefs}) |`,
            `| digest-ineligible (declared class, no digest possible) | ${report.digestIneligibleWithoutDigestCount} of ${report.verifiedWithoutDigestCount} undigested — register reviewed ${report.digestIneligibilityRegister.reviewedOn}, expires ${report.digestIneligibilityRegister.reviewExpiresOn} |`,
            `| bot-blocked (unverifiable by probe) | ${report.botBlockedUnverifiableCount} |`,
            `| throttled / unresponsive (unverifiable by probe) | ${report.throttledUnverifiableCount} |`,
            `| probe coverage (URLs that produced a verdict) | ${report.probeCoveragePercent}% (${report.definitiveVerdictUrlCount} of ${report.uniqueUrlsProbed} probed; ${report.unverifiableByProbeUrlCount} unverifiable) |`,
            `| stale | ${report.staleCount} |`,
            `| unverified (debt ratcheted by citations:audit, not gated here) | ${report.unverifiedCount} |`,
            `| ceiling usage (link rot + stale + drift) | ${report.citationCeilingUsage}/${report.citationCeiling} |`,
            "",
            "## Decayed (dead) links",
            ...(report.decayed.length ? top(report.decayed, "sourceUrl") : ["- none"]),
            "",
            "## Content drift (digest mismatch at HTTP 200)",
            ...(report.contentDrift.length ? top(report.contentDrift, "sourceUrl") : ["- none"]),
            "",
            "## Stale (past tiered window)",
            ...(report.stale.length ? top(report.stale, "citation") : ["- none"]),
            "",
            "## Throttled or unresponsive (not checked — not decay)",
            ...(report.throttledUnverifiable.length
              ? top(report.throttledUnverifiable, "sourceUrl").map(
                  (line, index) =>
                    `${line} (${report.throttledUnverifiable[index].reason}${
                      report.throttledUnverifiable[index].retryAfterSeconds
                        ? `, Retry-After ${report.throttledUnverifiable[index].retryAfterSeconds}s`
                        : ""
                    })`,
                )
              : ["- none"]),
            "",
            `Run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            "",
          ].join("\n");

          const gh = (args) => execFileSync("gh", args, { encoding: "utf8" });
          const existing = gh([
            "issue", "list",
            "--state", "open",
            "--search", title + " in:title",
            "--json", "number,title",
          ]).trim();
          const matches = JSON.parse(existing || "[]").filter((issue) => issue.title === title);

          const outcome = process.env.PROBE_RESULT;

          if (outcome !== "failure") {
            // Green, or a run that never completed a probe. A green run closes
            // the tracking issue instead of leaving a stale failure notice open.
            if (outcome === "success" && matches.length > 0) {
              gh([
                "issue",
                "close",
                String(matches[0].number),
                "--reason",
                "completed",
                "--comment",
                "The scheduled citation decay probe is green again — no link rot, no content drift, no stale reference, and the digest-eligible backlog is at or under its ratchet — so this tracking issue closes automatically. It reopens if a later scheduled run fails.",
              ]);
              console.log(`Closed tracking issue #${matches[0].number}`);
            } else {
              console.log(`Probe result ${outcome}: no tracking-issue change.`);
            }
          } else if (matches.length > 0) {
            gh(["issue", "edit", String(matches[0].number), "--body", body]);
            console.log(`Updated tracking issue #${matches[0].number}`);
          } else {
            gh(["issue", "create", "--title", title, "--body", body]);
            console.log("Opened new tracking issue");
          }
          NODE
