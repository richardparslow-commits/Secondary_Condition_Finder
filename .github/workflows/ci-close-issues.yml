name: Close CI Failure Issues
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
jobs:
  close-issues:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Close open ci-failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ISSUES=$(gh issue list --label "ci-failure" --state open --json number --jq '.[].number')
          for ISSUE in $ISSUES; do
            gh issue close "$ISSUE" --comment "CI is green again on main ✅ (run: ${{ github.event.workflow_run.html_url }})"
          done
