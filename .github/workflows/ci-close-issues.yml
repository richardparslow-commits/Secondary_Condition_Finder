name: Close CI Failure Issues (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled automation
        run: |
          echo "Automatic CI failure issue closure is disabled."
          echo "The previous workflow closed every open ci-failure issue after any successful CI run on main."
          echo "CI diagnostic issues now remain open until an explicitly scoped recovery workflow is reviewed and approved."
