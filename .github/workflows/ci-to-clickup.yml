name: Post CI Failures to ClickUp

# Escalates a genuine CI failure into a tracked ClickUp task.
#
# All decision logic lives in scripts/ci-failure-report.js, which is covered by
# tests/ci-failure-report.test.ts. It used to live in inline shell here, which
# could only execute inside a workflow_run trigger fired by an actual CI
# failure — untestable in practice, and it rotted invisibly: across its whole
# history this workflow never once succeeded. If you change escalation policy,
# change the script and its tests, not this file.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# `cancelled` is deliberately still passed to the job so the reporter can log
# WHY it is not escalated. ci.yml sets cancel-in-progress: true per ref, so a
# superseding push routinely cancels the run already in flight; filing an
# "investigate CI cancelled" task for that points a human at perfectly good
# code and trains the queue to be ignored. The conclusion filter lives in
# tested code rather than here so the reasoning is asserted, not assumed.

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-to-clickup-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  post-to-clickup:
    # Every conclusion EXCEPT the known-benign ones reaches the reporter, so a
    # conclusion GitHub adds later fails open inside tested code instead of
    # being dropped here by an equality list that can never anticipate it.
    # `cancelled` is deliberately NOT filtered out: the reporter logs why it is
    # exempt, so the skip is auditable rather than silent.
    # tests/ci-failure-report.test.ts keeps this list in sync with the script's
    # documented exemptions — do not edit one without the other.
    if: >-
      !contains(fromJSON('["success", "skipped", "neutral", "stale", "action_required"]'),
      github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SECURITY: a workflow_run job can read repository secrets. Checking out
      # github.event.workflow_run.head_sha or head_branch would execute code
      # from an untrusted pull request with CLICKUP_API_TOKEN in its
      # environment. No `ref:` is set on purpose — the default checkout for a
      # workflow_run event is the default branch, so only reviewed-and-merged
      # reporter code ever runs here. The untrusted head SHA is handed to the
      # reporter as DATA only, never as a checkout target.
      #
      # Marketplace actions are pinned to immutable commit SHAs (same refs as
      # ci.yml) rather than mutable tags: a secrets-bearing job must not be
      # redirectable by a tag being force-updated upstream.
      - name: Checkout reporter code from the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4

      # The reporter has no runtime dependencies (node:fs and the global fetch
      # only), so there is deliberately no install step here.
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: 22

      - name: Collect the completed run's job conclusions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Fail open: if job metadata cannot be fetched the reporter must still
          # escalate (naming the job "unknown") rather than drop a real alert.
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            | jq '[.[] | .jobs[]] | {jobs: .}' > jobs.json \
            || { echo '{"jobs":[]}' > jobs.json; echo "job metadata unavailable; escalating without job names"; }

      - name: Escalate the failure to ClickUp
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
          RUN: ${{ toJSON(github.event.workflow_run) }}
        run: |
          set -euo pipefail
          printf '%s' "$RUN" > run.json
          npm run ci:failure-report -- --run-file run.json --jobs-file jobs.json
