name: Qwen Code Assistant

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  qwen-agent:
    if: contains(github.event.comment.body, '@qwencoder') || contains(github.event.issue.body, '@qwencoder')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Qwen Code Action
        uses: QwenLM/qwen-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.QWEN_API_KEY }}
          openai_base_url: ${{ secrets.QWEN_OPENAI_BASE_URL }}
          openai_model: "qwen-max"
          qwen_debug: "true"
          prompt: |
            You are an autonomous AI coding agent operating inside a GitHub repository.
            Analyze the issue or comment that triggered this workflow.
            If asked to review or audit code, write your findings into a file 
            called 'QWEN_AUDIT.md' in the repository root.
            If asked to fix or implement something, make the necessary code changes.
            Always produce at least one file change so a Pull Request can be created.
