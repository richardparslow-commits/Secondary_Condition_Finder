name: Azure Static Web Apps Preview Cleanup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  discover_closed_prs:
    name: Discover Recently Closed PRs
    runs-on: ubuntu-latest
    outputs:
      pr_matrix: ${{ steps.collect.outputs.pr_matrix }}
      pr_count: ${{ steps.collect.outputs.pr_count }}
    steps:
      - name: Collect recently closed PR numbers
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const allClosed = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "closed",
              sort: "updated",
              direction: "desc",
              per_page: 100
            });

            const cutoffMs = 90 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            const recent = allClosed
              .filter(pr => pr.closed_at && (now - Date.parse(pr.closed_at) <= cutoffMs))
              .map(pr => pr.number)
              .slice(0, 30);

            core.setOutput("pr_matrix", JSON.stringify(recent));
            core.setOutput("pr_count", String(recent.length));
            core.info(`Queued ${recent.length} PR preview environments for close reconciliation.`);

  close_preview_environments:
    name: Close Preview Environments
    runs-on: ubuntu-latest
    needs: discover_closed_prs
    if: needs.discover_closed_prs.outputs.pr_count != '0'
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJson(needs.discover_closed_prs.outputs.pr_matrix) }}
    steps:
      - name: Create synthetic pull_request closed payload
        run: |
          cat >/tmp/swa-pr-close-event.json <<'JSON'
          {
            "action": "closed",
            "pull_request": {
              "number": ${{ matrix.pr_number }}
            },
            "repository": {
              "full_name": "${{ github.repository }}"
            }
          }
          JSON

      - name: Close SWA preview environment
        uses: Azure/static-web-apps-deploy@v1
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: /tmp/swa-pr-close-event.json
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_TREE_04B340F0F }}
          action: "close"
          app_location: "/"
          deployment_environment: pr-${{ matrix.pr_number }}
