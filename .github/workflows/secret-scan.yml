# Secret scan — gitleaks over the full history of every push that leaves the repo.
#
# Why history and not just the diff: a credential is committed once and lives in
# every later clone, so a scan that only looks at the newest commit reports
# "clean" for a repository whose history already carries a key. `fetch-depth: 0`
# is therefore load-bearing, and the scan runs against all commits reachable from
# the checked-out ref.
#
# The scanner is the upstream release binary, pinned to one version and verified
# against the checksum the project publishes for it — not a floating action tag
# and not `latest`. gitleaks' own rules stay enabled (`.gitleaks.toml` only adds
# two scoped allowlists), and reviewed historical findings live in
# `.gitleaksignore` by fingerprint with a reason each.
name: Secret scan

# Deliberately unscheduled: a scheduled monitor that fails must open a tracking
# issue (tests/sast-monitor-handoff.test.ts), and this gate's failure signal is
# the required check on the change that introduced it. Re-scan on demand with
# workflow_dispatch after upgrading the pinned scanner, which is when a new rule
# can surface a leak that was invisible before.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Published in gitleaks_8.30.1_checksums.txt:
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan every commit for secrets
        run: |
          set -euo pipefail
          # --redact keeps any finding out of the job log and the uploaded
          # report; the fingerprint and file/line are enough to act on.
          /tmp/gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Upload the redacted report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
