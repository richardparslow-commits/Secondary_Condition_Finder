name: Regulatory Intelligence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regulatory-intelligence-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-regulatory-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate knowledge base
        run: npm run kb:validate
      - name: Audit evidence architecture
        run: npm run evidence:architecture
      - name: Validate regulatory action registry
        run: npm run regulatory:validate
      - name: Audit regulatory intelligence
        run: npm run regulatory:audit
      - name: Run regulatory contract tests
        run: npx vitest run tests/evidence-architecture.test.ts tests/regulatory-intelligence.test.ts tests/regulatory-preflight.test.ts
