name: One-shot nanoid 3.3.18 remediation

on:
  push:
    branches:
      - agent/remove-dormant-event-logger

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-dormant-event-logger

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update nanoid override
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (pkg.overrides?.nanoid !== '3.3.17') {
            throw new Error(`Expected nanoid override 3.3.17, found ${pkg.overrides?.nanoid}`);
          }
          pkg.overrides.nanoid = '3.3.18';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Regenerate lockfile deterministically
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify the targeted lock update
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const nanoid = lock.packages?.['node_modules/nanoid'];
          if (pkg.overrides?.nanoid !== '3.3.18') throw new Error('package.json override was not updated');
          if (nanoid?.version !== '3.3.18') throw new Error(`Lockfile nanoid version is ${nanoid?.version}`);
          if (nanoid?.resolved !== 'https://registry.npmjs.org/nanoid/-/nanoid-3.3.18.tgz') {
            throw new Error(`Unexpected nanoid tarball: ${nanoid?.resolved}`);
          }
          NODE
          git diff --check

      - name: Remove helper and commit remediation
        run: |
          rm .github/workflows/one-shot-nanoid-3318.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/one-shot-nanoid-3318.yml
          git diff --cached --check
          git commit -m 'Fix nanoid security override'
          git push
