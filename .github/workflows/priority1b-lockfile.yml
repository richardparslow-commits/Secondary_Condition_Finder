name: Priority 1B lockfile refresh

on:
  push:
    branches:
      - agent/priority1b-local-pdf-docx

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[skip-lock-refresh]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/priority1b-local-pdf-docx
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Remove one-shot workflow and commit lockfile
        run: |
          git rm .github/workflows/priority1b-lockfile.yml
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh evidence parser lockfile [skip-lock-refresh]"
          git push origin HEAD:agent/priority1b-local-pdf-docx
