name: Generate OTel lockfile

on:
  push:
    branches: [agent/replace-appinsights-with-vercel-otel]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify replacement dependency graph
        run: |
          grep -q 'node_modules/@vercel/otel' package-lock.json
          grep -q 'node_modules/@opentelemetry/api' package-lock.json
          if grep -q '@microsoft/applicationinsights-web' package-lock.json; then
            echo 'Application Insights remains in package-lock.json' >&2
            exit 1
          fi
      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git commit -m 'Synchronize OpenTelemetry dependency lockfile'
          git push origin HEAD:${GITHUB_REF_NAME}
