name: Generate OTel lockfile

on:
  push:
    branches: [agent/replace-appinsights-with-vercel-otel]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify replacement dependency graph
        run: |
          grep -q 'node_modules/@vercel/otel' package-lock.json
          grep -q 'node_modules/@opentelemetry/api' package-lock.json
          if grep -q '@microsoft/applicationinsights-web' package-lock.json; then
            echo 'Application Insights remains in package-lock.json' >&2
            exit 1
          fi
      - name: Upload generated lockfile
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: otel-package-lock
          path: package-lock.json
          retention-days: 1
