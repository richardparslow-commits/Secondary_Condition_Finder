name: One-shot dormant event logger cleanup

on:
  push:
    branches:
      - agent/remove-dormant-event-logger

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Apply dormant logger cleanup
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before.json

          node <<'NODE'
          const fs = require('node:fs');

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          if (!pkg.dependencies?.['better-sqlite3']) throw new Error('better-sqlite3 dependency not found');
          if (!pkg.devDependencies?.['@types/better-sqlite3']) throw new Error('@types/better-sqlite3 dependency not found');
          if (!pkg.allowScripts?.['better-sqlite3@13.0.1']) throw new Error('better-sqlite3 allowScripts entry not found');
          delete pkg.dependencies['better-sqlite3'];
          delete pkg.devDependencies['@types/better-sqlite3'];
          delete pkg.allowScripts['better-sqlite3@13.0.1'];
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const nextPath = 'next.config.ts';
          let nextConfig = fs.readFileSync(nextPath, 'utf8');
          const externalPackageLine = '  serverExternalPackages: ["better-sqlite3"],\n';
          if (!nextConfig.includes(externalPackageLine)) throw new Error('Next.js external package entry not found');
          nextConfig = nextConfig.replace(externalPackageLine, '');
          fs.writeFileSync(nextPath, nextConfig);

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          const replacements = [
            [
              'JSON in version control so every change to a condition mapping or a citation\narrives as a reviewable diff. SQLite can back local aggregate event metrics.\n',
              'JSON in version control so every change to a condition mapping or a citation\narrives as a reviewable diff.\n',
            ],
            [
              '| `EVENT_LOG_SQLITE_PATH` | unset | Path to a SQLite file for aggregate recommendation event metrics. When unset, aggregate events are written as structured stdout lines instead. |\n',
              '',
            ],
            [
              'src/lib/log/           Aggregate event logging behind an EventLogger interface\n',
              '',
            ],
            [
              'Application Insights is configured for path-only page\nviews with automatic route/AJAX/fetch tracking disabled. Recommendation event\nlogs retain aggregate counts only; they do not persist condition identifiers,\ndiagnoses, symptoms, medications, exposures, or intake free text.\n',
              'Application Insights is configured for path-only page\nviews with automatic route/AJAX/fetch tracking disabled.\n',
            ],
          ];
          for (const [from, to] of replacements) {
            if (!readme.includes(from)) throw new Error(`README cleanup target not found: ${from.slice(0, 60)}`);
            readme = readme.replace(from, to);
          }
          fs.writeFileSync(readmePath, readme);
          NODE

          rm -rf src/lib/log
          rm tests/event-log.test.ts
          rm docs/event-logging-operations.md
          rm .github/workflows/one-shot-remove-dormant-event-logger.yml

      - name: Regenerate and prove package lock deterministically
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts

          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('/tmp/package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = structuredClone(before);

          delete expected.packages[''].dependencies['better-sqlite3'];
          delete expected.packages[''].devDependencies['@types/better-sqlite3'];
          delete expected.packages['node_modules/@types/better-sqlite3'];
          delete expected.packages['node_modules/better-sqlite3'];

          const otherNodeAddonApiParents = Object.entries(before.packages)
            .filter(([name]) => name !== 'node_modules/better-sqlite3')
            .filter(([, metadata]) => metadata?.dependencies?.['node-addon-api']);
          if (otherNodeAddonApiParents.length === 0) {
            delete expected.packages['node_modules/node-addon-api'];
          }

          assert.deepStrictEqual(after, expected, 'npm changed package-lock.json outside the exact dependency closure being removed');
          NODE

          sha256sum package-lock.json > /tmp/package-lock.after.sha256
          npm ci
          npm install --package-lock-only --ignore-scripts
          sha256sum -c /tmp/package-lock.after.sha256

      - name: Verify cleanup boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/lib/log
          test ! -e tests/event-log.test.ts
          test ! -e docs/event-logging-operations.md
          test -f src/lib/events/privacy-guard.ts
          test -f tests/event-log-privacy.test.ts
          git diff --exit-code HEAD -- src/lib/events/privacy-guard.ts tests/event-log-privacy.test.ts
          if git grep -n -E 'getEventLogger|createMemoryLogger|better-sqlite3|EVENT_LOG_SQLITE_PATH|src/lib/log'; then
            echo 'Found stale dormant logger reference(s).'
            exit 1
          fi
          git diff --check

      - name: Run validation suite
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:high
          npm run citations:audit
          npm run kb:validate
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Remove dormant event logger persistence stack'
          git push origin HEAD:agent/remove-dormant-event-logger
