name: Remove temporary logger documentation helper

on:
  push:
    branches:
      - agent/remove-dormant-event-logger

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/align-logger-docs.yml
          git commit -m 'Remove temporary logger documentation helper'
          git push origin HEAD:agent/remove-dormant-event-logger
